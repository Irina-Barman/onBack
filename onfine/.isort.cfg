[settings]
skip=.gitignore,.dockerignore, venv
src_paths = onfine
profile = black
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 79
use_parentheses = true
ensure_newline_before_comments = true
sections = FUTURE,STDLIB,THIRDPARTY,LOCALFOLDER
known_local_folder = blockchain, api, models, services, utils, app_factory