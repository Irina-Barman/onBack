[tool.poetry]
name = "Onfine - back"
description = "Test Automation for Sky Way"
authors = ["Zhuzhnev Petr"]
readme = "README.md"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
fix = true
line-length = 120
target-version = "py310"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle Error
    "W", # pycodestyle Warning
    "I", # isort
    "D", # pydocstyle
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "Q", # flake8-quotes
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PL" # Pylint
]

ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D200", # One-line docstring should fit on one line with quotes (found 3)
    "D202", # No blank lines allowed after function docstring (found 1)
    "D205", # 1 blank line required between summary line and description
    "D211", # No blank lines allowed before class docstring (found 1)
    "D212", # Multi-line docstring summary should start at the first line
    "D301", # Use r""" if any backslashes in a docstring
    "D401", # First line of docstring should be in imperative mood
    "D411", # Missing blank line before section ('Args')
    "D415", # First line should end with a period, question mark, or exclamation point
    "ANN002", # Missing type annotation for `*args`
    "ANN003", # Missing type annotation for **kwargs
    "ANN101", # Missing type annotation for self in method
    "ANN102", # Missing type annotation for cls in classmethod
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "B904", # complex assert
    "SIM105", # Use contextlib.suppress(Exception) instead of try-except-pass
    "SIM114", # SIM114 Combine if branches using logical or operator
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR5501", # reduce indentation
    "PLW0603", # Using of global statement
    "PLR2004", # Magic value used in comparison, consider replacing 2 with a constant variable
    "B009", # Do not call getattr with a constant attribute value.
    "N806", # Variable {name} in function should be lowercase
    "PLW0133", # Missing raise statement on exception
    "PLE0704", # Bare raise statement is not inside an exception handler
    "SIM103", # Return the condition file_name in files directly
    "SIM108", # Use ternary operator
]
exclude = [
    ".git",
    ".ruff_cache",
    ".tox",
    ".venv",
    "venv",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "D102", "D103", "ARG002"] # ARG002 Unused method argument: `auto_authorization` Добавлен толлько пока до конца не реализована автоавторизация

[tool.ruff.lint.pydocstyle]
convention = "google"
